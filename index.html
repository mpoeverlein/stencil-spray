<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spray Paint Postcards with Stencils</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,">
</head>
<body>
    <div class="app-container">
        <h1>🎨 <span>Stencil Spray</span> Postcard Studio</h1>

        <div class="main-row">
            <!-- Postcard -->
            <div class="postcard-wrapper" id="postcard-wrapper">
                <div class="canvas-stack">
                    <canvas id="postcard-canvas" width="600" height="400"></canvas>
                    <canvas id="stencil-overlay" width="600" height="400"></canvas>
                </div>
            </div>

            <!-- Stencil Panel -->
            <div class="stencil-panel" id="stencil-panel">
                <h3>🖼️ Stencils</h3>
                <div class="stencil-slot" data-index="0">
                    <span class="stencil-label">Stencil 1</span>
                    <canvas class="stencil-thumb" id="stencil-thumb-0" width="120" height="80"></canvas>
                    <input type="file" accept="image/png" class="stencil-upload" data-index="0" title="Upload PNG stencil">
                </div>
                <div class="stencil-slot" data-index="1">
                    <canvas class="stencil-thumb" id="stencil-thumb-1" width="120" height="80"></canvas>
                    <span class="stencil-label">Stencil 2</span>
                    <input type="file" accept="image/png" class="stencil-upload" data-index="1" title="Upload PNG stencil">
                </div>
                <div class="stencil-slot" data-index="2">
                    <canvas class="stencil-thumb" id="stencil-thumb-2" width="120" height="80"></canvas>
                    <span class="stencil-label">Stencil 3</span>
                    <input type="file" accept="image/png" class="stencil-upload" data-index="2" title="Upload PNG stencil">
                </div>
                <button class="btn-remove-stencil" id="btn-remove-stencil" disabled>✕ Remove Stencil</button>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls-bar" id="controls-bar">
            <div class="control-group">
                <label for="color-picker">🎨 Color</label>
                <input type="color" id="color-picker" value="#ff3366">
            </div>
            <div class="control-group">
                <label for="opacity-slider">💧 Opacity</label>
                <input type="range" id="opacity-slider" min="5" max="100" value="75" step="1">
                <span class="opacity-value" id="opacity-value">75%</span>
            </div>
            <div class="control-group">
                <label for="radius-slider">🔘 Radius</label>
                <input type="range" id="radius-slider" min="8" max="200" value="35" step="1">
                <span class="radius-value" id="radius-value">35</span>
            </div>
            <button class="toggle-btn" id="toggle-starry" title="Starry Sky Mode: large radius, few scattered spots">
                <span class="star-icon">✨</span> Starry Sky
            </button>
            <button class="btn-action undo" id="btn-undo" title="Undo last spray session">↩ Undo</button>
            <button class="btn-action danger" id="btn-clear" title="Clear entire postcard">🗑 Clear</button>
            <span class="active-stencil-indicator none" id="stencil-indicator">No stencil active</span>
        </div>
    </div>
    <script src="script.js" defer></script>
</body>
